name: Validate and Publish MAILTYPE to MCP Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-mcp.yml

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Run MAILTYPE test suite
        run: npm test
      - name: Install official MCP publisher
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Validate Registry metadata
        run: ./mcp-publisher validate
      - name: Authenticate with MCP Registry using GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish MAILTYPE
        run: ./mcp-publisher publish
      - name: Verify Registry discovery
        shell: bash
        run: |
          sleep 3
          curl -fsS 'https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.GSterlingPress/mailtype' | tee registry-result.json
          grep -q 'io.github.GSterlingPress/mailtype' registry-result.json
